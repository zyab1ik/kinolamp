name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    name: Validate and package release
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate tag version and main ancestry
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          test "$RELEASE_TAG" = "v$(cat VERSION)"
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Set up Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Run quality, coverage and release checks
        run: make check check-ci coverage test-release
      - name: Build release archives and checksums
        run: make dist
      - name: Upload release assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: dist/
          if-no-files-found: error
          retention-days: 7
  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    steps:
      - name: Download verified release assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: dist
      - name: Verify checksums and publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          (cd dist && sha256sum --check SHA256SUMS)
          if draft=$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft 2>/dev/null); then
            if [ "$draft" != true ]; then
              echo 'Release is already published; leaving its assets unchanged.' >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --generate-notes --title "Kinolamp $RELEASE_TAG"
          fi
          gh release upload "$RELEASE_TAG" dist/* --clobber
          gh release edit "$RELEASE_TAG" --draft=false --latest
          echo "Published [Kinolamp $RELEASE_TAG](https://github.com/$GH_REPO/releases/tag/$RELEASE_TAG)." >> "$GITHUB_STEP_SUMMARY"
