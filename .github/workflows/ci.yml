name: Check and test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - run: make check
      - run: make coverage
      - run: make build
  container:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: make docker-build
      - name: Verify non-root container and health
        run: |
          test "$(docker image inspect -f '{{.Config.User}}' kinolamp:local)" = 65532:65532
          docker run -d --name kp --read-only --cap-drop ALL --security-opt no-new-privileges -p 127.0.0.1:8788:3000 kinolamp:local
          trap 'docker rm -f kp' EXIT
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:8788/health; then exit 0; fi
            sleep 1
          done
          exit 1
