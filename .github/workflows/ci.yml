name: Check and test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: make check
      - run: make coverage
      - run: make build
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make docker-build
      - name: Verify non-root container and health
        run: |
          test "$(docker image inspect -f '{{.Config.User}}' lampa-kinopub:local)" = 65532:65532
          docker run -d --name kp --read-only --cap-drop ALL --security-opt no-new-privileges -p 127.0.0.1:8788:3000 lampa-kinopub:local
          trap 'docker rm -f kp' EXIT
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:8788/health; then exit 0; fi
            sleep 1
          done
          exit 1
